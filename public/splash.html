<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline';"
    />
    <title>WarrantyVault</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 620px;
        height: 340px;
        background: #dce7f8;
        color: #213959;
        font-family:
          Segoe UI,
          Arial,
          sans-serif;
        padding: 34px 38px;
        overflow: hidden;
        border: 1px solid #21395944;
      }
      header {
        display: flex;
        align-items: center;
        gap: 13px;
      }
      img {
        width: 54px;
        height: 54px;
      }
      header strong {
        font-size: 23px;
        font-weight: 600;
        letter-spacing: -1px;
      }
      header small {
        display: block;
        font-size: 10px;
        margin-top: 5px;
        letter-spacing: 0.12em;
        opacity: 0.8;
      }
      h1 {
        font-family: "Segoe UI", sans-serif;
        font-size: 32px;
        font-weight: 400;
        margin: 30px 0 9px;
      }
      p {
        font-size: 15px;
        margin: 0;
      }
      footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-top: 1px solid #21395940;
        padding-top: 17px;
        margin-top: 30px;
        font-size: 11px;
      }
      footer span:last-child {
        font-size: 12px;
      }
      .dots {
        letter-spacing: 3px;
        margin-inline-end: 8px;
      }
      header img {
        position: absolute;
        right: 42px;
        top: 120px;
        width: 115px;
        height: 115px;
      }
      header {
        padding-bottom: 22px;
        border-bottom: 1px solid #21395933;
      }
      h1 {
        font-size: 30px;
        max-width: 340px;
        margin-top: 23px;
      }
      body > p {
        text-align: left;
        max-width: 320px;
      }
      footer {
        margin-top: 25px;
        border: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="app-icon.png" alt="" />
      <div>
        <strong>WarrantyVault</strong
        ><small>YOUR PERSONAL PURCHASE ARCHIVE</small>
      </div>
    </header>
    <h1>Every purchase, protected.</h1>
    <p lang="ar" dir="rtl">كل مشترياتك في مكان آمن.</p>
    <footer>
      <span><b class="dots">•••</b>Opening your workspace</span
      ><span lang="ar" dir="rtl">جارٍ فتح مساحة العمل</span>
    </footer>
  </body>
</html>
