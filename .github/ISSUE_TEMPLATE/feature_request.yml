name: "Feature request / اقتراح تحسين"
description: "Describe a missing WarrantyVault workflow and who it helps."
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: "The problem / المشكلة"
      description: "Who faces this problem, and how do they handle it today?"
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: "Desired outcome / النتيجة المطلوبة"
      description: "Describe the action and result you would like in WarrantyVault."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives and scope / البدائل وحدود الاقتراح"
      description: "What have you tried? What would be a small useful first version?"
